version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: flight_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight_pass}
      POSTGRES_DB: ${POSTGRES_DB:-flight_delays}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flight_user} -d ${POSTGRES_DB:-flight_delays}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: python:3.10-slim
    container_name: mlflow_server
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=postgresql://${POSTGRES_USER:-flight_user}:${POSTGRES_PASSWORD:-flight_pass}@postgres:5432/${POSTGRES_DB:-flight_delays}
      - MLFLOW_ARTIFACT_ROOT=/mlruns
    command: >
      bash -c "pip install mlflow psycopg2-binary && 
               mlflow server --host 0.0.0.0 --port 5000 
               --backend-store-uri postgresql://${POSTGRES_USER:-flight_user}:${POSTGRES_PASSWORD:-flight_pass}@postgres:5432/${POSTGRES_DB:-flight_delays}
               --default-artifact-root /mlruns"
    volumes:
      - ./mlruns:/mlruns
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: flight_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-flight_user}:${POSTGRES_PASSWORD:-flight_pass}@postgres:5432/${POSTGRES_DB:-flight_delays}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - postgres
      - mlflow

volumes:
  postgres_data:
